# Every push to main builds the Windows installer and publishes it as a GitHub Release.
# Installed copies of Quill check those releases when they open and offer to restart into
# the new version. Each run gets its own version, 0.1.<run number>.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create the release and upload the installer

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Version this build
        run: npm version 0.1.${{ github.run_number }} --no-git-tag-version

      - name: Typecheck and build
        run: npm run check
        env:
          # Optional: without it the canvas runs unlicensed. Add it under Settings > Secrets > Actions.
          RENDERER_VITE_TLDRAW_LICENSE_KEY: ${{ secrets.TLDRAW_LICENSE_KEY }}

      # electron-builder uploads its files in parallel, and each upload creates the release if it
      # can't find one, so without this there end up several. Creating the draft first gives them
      # one release to share.
      - name: Create the draft release
        shell: bash
        run: gh release create "v0.1.${{ github.run_number }}" --draft --title "0.1.${{ github.run_number }}" --target "${{ github.sha }}" --notes "Built from ${{ github.sha }}."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and upload to the draft
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only now, with the installer, blockmap and latest.yml all uploaded, can installed copies see it.
      - name: Check every file is there, then publish
        shell: bash
        run: |
          tag="v0.1.${{ github.run_number }}"
          assets=$(gh release view "$tag" --json assets -q '[.assets[].name] | join(" ")')
          echo "assets: $assets"
          for f in latest.yml "Quill-Setup-0.1.${{ github.run_number }}.exe" "Quill-Setup-0.1.${{ github.run_number }}.exe.blockmap"; do
            [[ " $assets " == *" $f "* ]] || { echo "::error::$f is missing from $tag"; exit 1; }
          done
          gh release edit "$tag" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
