<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Flat: one indigo tile, one white feather. -->
  <rect width="512" height="512" rx="112" fill="#4f46e5"/>
  <g transform="rotate(38 256 256)">
    <!-- the vane, a touch fuller on one side -->
    <path d="M256 64 C 350 150, 344 304, 264 384 L 248 384 C 176 308, 164 168, 256 64 Z" fill="#fff"/>
    <!-- the shaft, and one split in the vane -->
    <path d="M256 128 V 384 M256 262 L 302 196" stroke="#4f46e5" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- the quill below the vane -->
    <path d="M256 384 V 456" stroke="#fff" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
